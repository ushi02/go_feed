name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      # Integration tests start MySQL with testcontainers; GitHub's Ubuntu runners have Docker.
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as the Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc -b runs first, so a type error fails CI.
      - run: npm run build

  # Setup: docs/rss-reader/deploy-ec2.md, step 9. Skipped until the variables are set.
  deploy:
    needs: [go, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      id-token: write # lets the job request an OIDC token for AWS
      contents: read
    env:
      AWS_REGION: ap-southeast-2
      INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Pull and rebuild on the server
        run: |
          # SSM runs commands as root; git needs ubuntu's deploy key.
          script='sudo -u ubuntu -H bash -c "cd ~/go_feed && git pull --ff-only && docker compose -f docker-compose.prod.yml up -d --build && docker image prune -f && git log --oneline -1"'
          jq -n --arg c "$script" '{commands: [$c], executionTimeout: ["1200"]}' > params.json
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" --parameters file://params.json \
            --query Command.CommandId --output text)
          status=Pending
          for _ in $(seq 120); do
            sleep 10
            # The invocation may not exist for the first few seconds.
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          echo "status: $status"
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -n 40
          [ "$status" = Success ]
      - name: Check /healthz
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://gugu.ushi02.live/healthz
